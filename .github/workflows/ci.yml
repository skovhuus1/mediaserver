name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      API_PORT: 3001
      DATABASE_URL: postgresql://bbmedia:bbmedia_pass@localhost:5432/bbmedia_test?schema=public
      REDIS_URL: redis://localhost:6379
      CORS_ORIGIN: http://localhost:5555
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-ci-only-secret-ci-only-secret
      JWT_ACCESS_TTL_SECONDS: 900
      JWT_REFRESH_TTL_DAYS: 30
      ENCRYPTION_KEY: base64:Y2ktb25seS0zMi1ieXRlLWVuY3J5cHRpb24ta2V5ISE=
      SESSION_LEASE_SECONDS: 90
      BILLING_ENABLED: false
      BB_MEDIA_UPDATE_ENABLED: false
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bbmedia_test
          POSTGRES_USER: bbmedia
          POSTGRES_PASSWORD: bbmedia_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bbmedia -d bbmedia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Apply migrations
        run: npm run prisma:migrate
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Integration tests
        run: npm run test:integration
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Validate Compose
        run: |
          cp .env.example .env
          node scripts/bootstrap-env.mjs
          docker compose config --quiet
          DOCKER_GID=999 docker compose -f docker-compose.yml -f docker-compose.updater.yml config --quiet
      - name: Build containers
        run: docker compose build
      - name: Validate HDR transcoder capabilities
        run: |
          docker compose run --rm --no-deps --entrypoint sh worker -lc \
            'ffmpeg -hide_banner -encoders 2>&1 | grep -q libx265 && ffmpeg -hide_banner -filters 2>&1 | grep -q zscale'
      - name: Smoke test container startup
        run: |
          set -Eeuo pipefail
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker compose ps
              docker compose logs --no-color --tail=200
            fi
            docker compose down --volumes
            exit "$status"
          }
          trap cleanup EXIT

          mkdir -p media/Film/Action
          docker compose run --rm --no-deps \
            --user 0:0 \
            --entrypoint ffmpeg \
            -v "$PWD/media/Film/Action:/ci-media" \
            worker \
            -hide_banner -loglevel error \
            -f lavfi -i color=c=black:s=320x240:d=1 \
            -f lavfi -i anullsrc=r=48000:cl=stereo \
            -shortest -c:v libx264 -c:a aac \
            "/ci-media/CI Smoke (2026).mp4"
          cat > "media/Film/Action/CI Smoke (2026).da.srt" <<'SUBTITLE'
          1
          00:00:00,000 --> 00:00:00,900
          BoltBytes undertekst
          SUBTITLE

          docker compose up --detach --wait --wait-timeout 180
          sleep 5

          api_id="$(docker compose ps --quiet api)"
          worker_id="$(docker compose ps --quiet worker)"
          transcoder_id="$(docker compose ps --quiet transcoder)"
          test -n "$api_id"
          test -n "$worker_id"
          test -n "$transcoder_id"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$api_id")" = "healthy"
          test "$(docker inspect --format '{{.State.Status}}' "$worker_id")" = "running"
          test "$(docker inspect --format '{{.State.Status}}' "$transcoder_id")" = "running"
          curl --fail --silent --show-error http://127.0.0.1:5555/api/v1/system/health

          api_base="http://127.0.0.1:5555/api/v1"
          curl --fail --silent --show-error \
            -H 'content-type: application/json' \
            -d '{"accountName":"CI Account","serverName":"CI Media","adminDisplayName":"CI Admin","adminEmail":"ci@example.test","adminPassword":"ci-password-123456","language":"da","timezone":"Europe/Copenhagen","mountPath":"/media"}' \
            "$api_base/setup" >/dev/null
          login="$(curl --fail --silent --show-error \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.test","password":"ci-password-123456","deviceFingerprint":"ci-device-fingerprint","deviceName":"CI Browser","deviceType":"web","platform":"linux"}' \
            "$api_base/auth/login")"
          token="$(jq -er '.accessToken' <<<"$login")"
          test "$(curl --fail --silent --show-error -H "authorization: Bearer $token" "$api_base/system/update/progress" | jq -r '.state')" = "idle"
          root_id="$(curl --fail --silent --show-error -H "authorization: Bearer $token" "$api_base/storage-roots" | jq -er '.[0].id')"
          library="$(curl --fail --silent --show-error \
            -H "authorization: Bearer $token" \
            -H 'content-type: application/json' \
            -d "{\"storageRootId\":\"$root_id\",\"name\":\"CI Film\",\"type\":\"movie\",\"path\":\"/media/Film\",\"recursive\":true}" \
            "$api_base/libraries")"
          library_id="$(jq -er '.id' <<<"$library")"
          library_path_id="$(jq -er '.paths[0].id' <<<"$library")"
          library="$(curl --fail --silent --show-error \
            -X PATCH \
            -H "authorization: Bearer $token" \
            -H 'content-type: application/json' \
            -d "{\"storageRootId\":\"$root_id\",\"name\":\"CI Film Edited\",\"type\":\"movie\",\"path\":\"/media/Film\",\"recursive\":true}" \
            "$api_base/libraries/$library_id")"
          test "$(jq -r '.name' <<<"$library")" = "CI Film Edited"
          postgres_user="$(grep '^POSTGRES_USER=' .env | cut -d= -f2-)"
          postgres_db="$(grep '^POSTGRES_DB=' .env | cut -d= -f2-)"
          docker compose exec -T postgres psql \
            -v ON_ERROR_STOP=1 \
            -U "$postgres_user" \
            -d "$postgres_db" \
            -c "UPDATE library_paths SET path = '/media/media/Film' WHERE id = '$library_path_id';"
          curl --fail --silent --show-error \
            -X POST -H "authorization: Bearer $token" \
            "$api_base/libraries/$library_id/scans" >/dev/null

          scan_status=""
          for _ in $(seq 1 45); do
            scans="$(curl --fail --silent --show-error -H "authorization: Bearer $token" "$api_base/libraries/$library_id/scans")"
            scan_status="$(jq -r '.[0].status // empty' <<<"$scans")"
            if [ "$scan_status" = "completed" ] || [ "$scan_status" = "failed" ]; then break; fi
            sleep 2
          done
          if [ "$scan_status" != "completed" ]; then
            jq '.[0]' <<<"$scans"
            exit 1
          fi
          test "$(jq -r '.[0].filesSeen' <<<"$scans")" -ge 1
          test "$(curl --fail --silent --show-error -H "authorization: Bearer $token" "$api_base/media" | jq 'length')" -ge 1
          media="$(curl --fail --silent --show-error -H "authorization: Bearer $token" "$api_base/media")"
          test "$(jq -r '.[0].title' <<<"$media")" = "CI Smoke"
          test "$(jq -r '.[0].type' <<<"$media")" = "movie"
          test "$(jq -r '.[0].category' <<<"$media")" = "Action"
          test "$(jq -r '.[0].releaseYear' <<<"$media")" -eq 2026
          media_id="$(jq -er '.[0].id' <<<"$media")"
          playback_context="$(curl --fail --silent --show-error -H "authorization: Bearer $token" "$api_base/playback/context")"
          profile_id="$(jq -er '.profileId' <<<"$playback_context")"
          device_id="$(jq -er '.deviceId' <<<"$playback_context")"
          authorization="$(curl --fail --silent --show-error \
            -H "authorization: Bearer $token" \
            -H 'content-type: application/json' \
            -d "{\"profileId\":\"$profile_id\",\"mediaId\":\"$media_id\",\"deviceId\":\"$device_id\",\"capabilities\":{\"supportedCodecs\":[\"h264\",\"aac\"],\"supportedContainers\":[\"mov\",\"mp4\"]}}" \
            "$api_base/playback/authorize")"
          session_id="$(jq -er '.sessionId' <<<"$authorization")"
          stream_url="$(jq -er '.streamUrl' <<<"$authorization")"
          test "$(jq -r '.method' <<<"$authorization")" = "direct_play"
          subtitle_url="$(jq -er '.subtitleTracks[] | select(.language == "da") | .src' <<<"$authorization")"
          curl --fail --silent --show-error \
            -H 'origin: https://cast.example.test' \
            -D /tmp/bb-media-subtitle-headers \
            -o /tmp/bb-media-subtitle.vtt \
            "http://127.0.0.1:5555$subtitle_url"
          grep -Eiq '^access-control-allow-origin: https://cast\.example\.test' /tmp/bb-media-subtitle-headers
          grep -Fxq 'WEBVTT' /tmp/bb-media-subtitle.vtt
          grep -Fq '00:00:00.000 --> 00:00:00.900' /tmp/bb-media-subtitle.vtt
          curl --fail --silent --show-error \
            -H 'range: bytes=0-31' \
            -H 'origin: https://cast.example.test' \
            -D /tmp/bb-media-stream-headers \
            -o /tmp/bb-media-stream-body \
            "http://127.0.0.1:5555$stream_url"
          grep -Eq '^HTTP/[0-9.]+ 206' /tmp/bb-media-stream-headers
          grep -Eiq '^access-control-allow-origin: https://cast\.example\.test' /tmp/bb-media-stream-headers
          test "$(wc -c < /tmp/bb-media-stream-body)" -eq 32
          curl --fail --silent --show-error \
            -X PATCH \
            -H "authorization: Bearer $token" \
            -H 'content-type: application/json' \
            -d '{"positionMs":250,"durationMs":1000}' \
            "$api_base/playback/sessions/$session_id/progress" >/dev/null
          continue_items="$(curl --fail --silent --show-error -H "authorization: Bearer $token" "$api_base/playback/history/continue")"
          test "$(jq 'length' <<<"$continue_items")" -eq 1
          test "$(jq -r '.[0].progress.positionMs' <<<"$continue_items")" -eq 250
          curl --fail --silent --show-error \
            -X PATCH \
            -H "authorization: Bearer $token" \
            -H 'content-type: application/json' \
            -d '{"positionMs":950,"durationMs":1000}' \
            "$api_base/playback/sessions/$session_id/progress" >/dev/null
          test "$(curl --fail --silent --show-error -H "authorization: Bearer $token" "$api_base/playback/history/continue" | jq 'length')" -eq 0
          curl --fail --silent --show-error \
            -X DELETE \
            -H "authorization: Bearer $token" \
            "$api_base/playback/sessions/$session_id" >/dev/null

          transcode_authorization="$(curl --fail --silent --show-error \
            -H "authorization: Bearer $token" \
            -H 'content-type: application/json' \
            -d "{\"profileId\":\"$profile_id\",\"mediaId\":\"$media_id\",\"deviceId\":\"$device_id\",\"capabilities\":{\"supportedCodecs\":[\"vp9\"],\"supportedContainers\":[\"webm\"]}}" \
            "$api_base/playback/authorize")"
          transcode_session_id="$(jq -er '.sessionId' <<<"$transcode_authorization")"
          transcode_status_url="$(jq -er '.transcodeStatusUrl' <<<"$transcode_authorization")"
          test "$(jq -r '.method' <<<"$transcode_authorization")" = "transcode"
          transcode_state=""
          for _ in $(seq 1 90); do
            transcode_status="$(curl --fail --silent --show-error "http://127.0.0.1:5555$transcode_status_url")"
            transcode_state="$(jq -r '.state' <<<"$transcode_status")"
            if [ "$transcode_state" = "ready" ] || [ "$transcode_state" = "failed" ]; then break; fi
            sleep 1
          done
          if [ "$transcode_state" != "ready" ]; then
            jq . <<<"$transcode_status"
            exit 1
          fi
          transcode_stream_url="$(jq -er '.streamUrl' <<<"$transcode_authorization")"
          curl --fail --silent --show-error \
            -H 'origin: https://cast.example.test' \
            -D /tmp/bb-media-master-headers \
            -o /tmp/bb-media-master.m3u8 \
            "http://127.0.0.1:5555$transcode_stream_url"
          grep -Eiq '^access-control-allow-origin: https://cast\.example\.test' /tmp/bb-media-master-headers
          grep -Eq '^#EXT-X-STREAM-INF:.*BANDWIDTH=[1-9][0-9]*.*RESOLUTION=320x240' /tmp/bb-media-master.m3u8
          variant_path="$(grep -E '^stream\.m3u8\?token=' /tmp/bb-media-master.m3u8 | head -n1)"
          test -n "$variant_path"
          curl --fail --silent --show-error \
            -o /tmp/bb-media-stream.m3u8 \
            "http://127.0.0.1:5555/api/v1/playback/sessions/$transcode_session_id/hls/$variant_path"
          segment_path="$(grep -E '^segment[0-9]{5}\.ts\?token=' /tmp/bb-media-stream.m3u8 | head -n1)"
          test -n "$segment_path"
          curl --fail --silent --show-error \
            -o /tmp/bb-media-segment.ts \
            "http://127.0.0.1:5555/api/v1/playback/sessions/$transcode_session_id/hls/$segment_path"
          test -s /tmp/bb-media-segment.ts
          curl --fail --silent --show-error \
            -X DELETE \
            -H "authorization: Bearer $token" \
            "$api_base/playback/sessions/$transcode_session_id" >/dev/null
          test "$(curl --fail --silent --show-error -H "authorization: Bearer $token" "$api_base/libraries" | jq -r --arg id "$library_id" '.[] | select(.id == $id) | .paths[0].path')" = "/media/Film"
          curl --fail --silent --show-error \
            -X DELETE \
            -H "authorization: Bearer $token" \
            "$api_base/libraries/$library_id" >/dev/null
          test "$(curl --fail --silent --show-error -H "authorization: Bearer $token" "$api_base/libraries" | jq 'length')" -eq 0
