name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bbmedia
          POSTGRES_USER: bbmedia
          POSTGRES_PASSWORD: bbmedia_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Prepare environment
        run: |
          cp .env.example .env
          npm run env:bootstrap

      - name: Install deps
        run: npm install

      - name: API migrations
        run: npm run prisma:migrate --workspace=services/api

      - name: Shared types build
        run: npm run build --workspace=shared/types

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: API tests
        run: npm run test --workspace=services/api

      - name: API build
        run: npm run build:api

      - name: Web build
        run: npm run build:web

      - name: Docker compose validation
        run: docker compose -f docker-compose.yml config

      - name: Docker compose build
        run: docker compose -f docker-compose.yml build --no-cache
