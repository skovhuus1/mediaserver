name: Android release

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Semver without the android-v prefix
        required: true
        type: string
      publish_google_play:
        description: Publish the mobile AAB to Google Play
        required: true
        default: false
        type: boolean
      play_track:
        description: Google Play track
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: android-release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      FIREBASE_ANDROID_OPTIONS_BASE64: ${{ secrets.FIREBASE_ANDROID_OPTIONS_BASE64 || secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      BB_MEDIA_CAST_RECEIVER_APP_ID: ${{ vars.BB_MEDIA_CAST_RECEIVER_APP_ID }}
      BB_MEDIA_DEFAULT_SERVER_URL: ${{ vars.BB_MEDIA_DEFAULT_SERVER_URL }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate immutable release source and configuration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Release commit must be contained in origin/main." >&2; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Manual production releases must run from main." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then version="${GITHUB_REF_NAME#android-v}"; else version="${{ inputs.version }}"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || { echo "Version must be valid semver: $version" >&2; exit 1; }
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD FIREBASE_ANDROID_OPTIONS_BASE64 BB_MEDIA_CAST_RECEIVER_APP_ID BB_MEDIA_DEFAULT_SERVER_URL; do
            [[ -n "${!name:-}" ]] || { echo "Missing required release configuration: $name" >&2; exit 1; }
          done
          if [[ "${{ inputs.publish_google_play || false }}" == "true" && -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is required for Google Play publishing." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=android-v$version" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Materialize protected Android configuration
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/boltbytes-release.jks"
          chmod 600 "$RUNNER_TEMP/boltbytes-release.jks"
          printf '%s' "$FIREBASE_ANDROID_OPTIONS_BASE64" | base64 --decode > clients/mobile-tv/android/app/google-services.json
          chmod 600 clients/mobile-tv/android/app/google-services.json
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/boltbytes-release.jks" >> "$GITHUB_ENV"
      - name: Resolve, analyze and test Flutter client
        working-directory: clients/mobile-tv
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
      - name: Build signed mobile APK and AAB
        working-directory: clients/mobile-tv
        run: |
          flutter build apk --release --flavor mobile --build-name="$RELEASE_VERSION" --build-number="$BUILD_NUMBER" --dart-define=BB_MEDIA_DEVICE_TYPE=mobile --dart-define=BB_MEDIA_DEFAULT_SERVER_URL="$BB_MEDIA_DEFAULT_SERVER_URL" --dart-define=BB_MEDIA_CAST_RECEIVER_APP_ID="$BB_MEDIA_CAST_RECEIVER_APP_ID"
          flutter build appbundle --release --flavor mobile --build-name="$RELEASE_VERSION" --build-number="$BUILD_NUMBER" --dart-define=BB_MEDIA_DEVICE_TYPE=mobile --dart-define=BB_MEDIA_DEFAULT_SERVER_URL="$BB_MEDIA_DEFAULT_SERVER_URL" --dart-define=BB_MEDIA_CAST_RECEIVER_APP_ID="$BB_MEDIA_CAST_RECEIVER_APP_ID"
      - name: Build signed Android TV APK
        working-directory: clients/mobile-tv
        run: >-
          flutter build apk --release --flavor tv
          --build-name="$RELEASE_VERSION" --build-number="$BUILD_NUMBER"
          --dart-define=BB_MEDIA_DEVICE_TYPE=tv
          --dart-define=BB_MEDIA_DEFAULT_SERVER_URL="$BB_MEDIA_DEFAULT_SERVER_URL"
          --dart-define=BB_MEDIA_CAST_RECEIVER_APP_ID="$BB_MEDIA_CAST_RECEIVER_APP_ID"
      - name: Collect and certify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp clients/mobile-tv/build/app/outputs/flutter-apk/app-mobile-release.apk release/boltbytes-media-mobile-release.apk
          cp clients/mobile-tv/build/app/outputs/flutter-apk/app-tv-release.apk release/boltbytes-media-tv-release.apk
          cp clients/mobile-tv/build/app/outputs/bundle/mobileRelease/app-mobile-release.aab release/boltbytes-media-google-play-release.aab
          node scripts/android-release-evidence.mjs --mobile release/boltbytes-media-mobile-release.apk --tv release/boltbytes-media-tv-release.apk --aab release/boltbytes-media-google-play-release.aab --version "$RELEASE_VERSION" --build-number "$BUILD_NUMBER" --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --output-dir release
          cat > release/RELEASE_NOTES.md <<EOF
          # BoltBytes Media Android $RELEASE_VERSION

          Certified mobile and Android TV artifacts built from commit \`$GITHUB_SHA\`.

          Verify with \`sha256sum -c SHA256SUMS.txt\` and \`gh attestation verify <artifact> -R $GITHUB_REPOSITORY\`.
          EOF
      - name: Upload certified workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: boltbytes-android-release-${{ env.RELEASE_VERSION }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
      - name: Generate GitHub artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: release/*
      - name: Publish mobile bundle to Google Play
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_google_play }}
        run: node scripts/publish-google-play.mjs --bundle release/boltbytes-media-google-play-release.aab --track "${{ inputs.play_track }}"
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == "true" ]] || { echo "Release $RELEASE_TAG already exists and is immutable." >&2; exit 1; }
            gh release upload "$RELEASE_TAG" release/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file release/RELEASE_NOTES.md --draft=false --latest
          else
            gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --title "BoltBytes Media Android $RELEASE_VERSION" --notes-file release/RELEASE_NOTES.md --draft
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
      - name: Remove protected files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/boltbytes-release.jks"
          rm -f clients/mobile-tv/android/app/google-services.json
