name: flutter-client

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BB_MEDIA_CAST_RECEIVER_APP_ID: ${{ vars.BB_MEDIA_CAST_RECEIVER_APP_ID }}
    defaults:
      run:
        working-directory: clients/mobile-tv
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build mobile debug APK
        run: |
          flutter build apk --debug \
            --dart-define=BB_MEDIA_API_URL=https://media.boltbytes.com/api/v1 \
            --dart-define=BB_MEDIA_DEVICE_TYPE=mobile
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/boltbytes-media-mobile-debug.apk
      - name: Build Android TV debug APK
        run: |
          flutter build apk --debug \
            --dart-define=BB_MEDIA_API_URL=https://media.boltbytes.com/api/v1 \
            --dart-define=BB_MEDIA_DEVICE_TYPE=tv
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/boltbytes-media-tv-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: boltbytes-media-android-debug
          path: |
            clients/mobile-tv/build/app/outputs/flutter-apk/boltbytes-media-mobile-debug.apk
            clients/mobile-tv/build/app/outputs/flutter-apk/boltbytes-media-tv-debug.apk
          if-no-files-found: error
          retention-days: 7
