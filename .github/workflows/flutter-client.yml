name: Flutter client

on:
  push:
    branches: [main, "agent/**"]
    paths:
      - "clients/mobile-tv/**"
      - "scripts/android-release-evidence.mjs"
      - "scripts/android-release-evidence.test.mjs"
      - "scripts/android-version-code.mjs"
      - "scripts/android-version-code.test.mjs"
      - "scripts/assert-android-shrinker.mjs"
      - ".github/workflows/flutter-client.yml"
      - ".github/workflows/android-mobile-release.yml"
      - ".github/workflows/android-tv-release.yml"
  pull_request:
    paths:
      - "clients/mobile-tv/**"
      - "scripts/android-release-evidence.mjs"
      - "scripts/android-release-evidence.test.mjs"
      - "scripts/android-version-code.mjs"
      - "scripts/android-version-code.test.mjs"
      - "scripts/assert-android-shrinker.mjs"
      - ".github/workflows/flutter-client.yml"
      - ".github/workflows/android-mobile-release.yml"
      - ".github/workflows/android-tv-release.yml"

permissions:
  contents: read

concurrency:
  group: flutter-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-client:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: clients/mobile-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Test Android release tooling
        run: node --test ../../scripts/android-release-evidence.test.mjs ../../scripts/android-version-code.test.mjs
      - name: Resolve deterministic Android version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          build_number="$(node ../../scripts/android-version-code.mjs --version "$version" --attempt "$GITHUB_RUN_ATTEMPT")"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
      - name: Native Android lint
        run: cd android && ./gradlew --console=plain :app:lintMobileDebug :app:lintTvRelease
      - name: Build mobile flavor
        run: >-
          flutter build apk --debug --flavor mobile -t lib/main_mobile.dart
          --build-name="$RELEASE_VERSION" --build-number="$BUILD_NUMBER"
          --dart-define=BB_MEDIA_DEVICE_TYPE=mobile
          --dart-define=BB_MEDIA_APP_VERSION="$RELEASE_VERSION"
          --dart-define=BB_MEDIA_DEFAULT_SERVER_URL=https://media.boltbytes.com/api/v1
      - name: Build TV flavor
        run: >-
          flutter build apk --release --flavor tv -t lib/main_tv.dart
          --build-name="$RELEASE_VERSION" --build-number="$BUILD_NUMBER"
          --dart-define=BB_MEDIA_DEVICE_TYPE=tv
          --dart-define=BB_MEDIA_APP_VERSION="$RELEASE_VERSION"
          --dart-define=BB_MEDIA_DEFAULT_SERVER_URL=https://media.boltbytes.com/api/v1
      - name: Verify TV release shrinker output
        run: >-
          node ../../scripts/assert-android-shrinker.mjs
          build/app/outputs/mapping/tvRelease/mapping.txt
      - name: Prepare CI artifacts
        run: |
          mkdir -p build/ci-artifacts build/release-gate
          cp build/app/outputs/flutter-apk/app-mobile-debug.apk build/ci-artifacts/boltbytes-media-mobile-debug.apk
          cp build/app/outputs/flutter-apk/app-tv-release.apk build/ci-artifacts/boltbytes-media-tv-release.apk
      - name: Certify merged Android manifests and artifacts
        run: >-
          node ../../scripts/android-release-evidence.mjs
          --mobile build/ci-artifacts/boltbytes-media-mobile-debug.apk
          --tv build/ci-artifacts/boltbytes-media-tv-release.apk
          --version "$RELEASE_VERSION"
          --build-number "$BUILD_NUMBER"
          --commit ${{ github.sha }}
          --repository ${{ github.repository }}
          --output-dir build/release-gate
          --allow-debug-signing true
      - name: Upload certified CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boltbytes-android-debug-${{ github.run_number }}
          path: |
            clients/mobile-tv/build/ci-artifacts/*.apk
            clients/mobile-tv/build/release-gate/*
          if-no-files-found: error
          retention-days: 14
