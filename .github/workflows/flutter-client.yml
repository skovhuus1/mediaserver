name: Flutter client

on:
  push:
    branches: [main, "agent/**"]
    paths:
      - "clients/mobile-tv/**"
      - "scripts/android-release-evidence.mjs"
      - "scripts/android-release-evidence.test.mjs"
      - ".github/workflows/flutter-client.yml"
      - ".github/workflows/android-release.yml"
  pull_request:
    paths:
      - "clients/mobile-tv/**"
      - "scripts/android-release-evidence.mjs"
      - "scripts/android-release-evidence.test.mjs"
      - ".github/workflows/flutter-client.yml"
      - ".github/workflows/android-release.yml"

permissions:
  contents: read

concurrency:
  group: flutter-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-client:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: clients/mobile-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build mobile flavor
        run: >-
          flutter build apk --debug --flavor mobile
          --build-name=0.1.0 --build-number=${{ github.run_number }}
          --dart-define=BB_MEDIA_DEVICE_TYPE=mobile
      - name: Build TV flavor
        run: >-
          flutter build apk --debug --flavor tv
          --build-name=0.1.0 --build-number=${{ github.run_number }}
          --dart-define=BB_MEDIA_DEVICE_TYPE=tv
      - name: Prepare CI artifacts
        run: |
          mkdir -p build/ci-artifacts build/release-gate
          cp build/app/outputs/flutter-apk/app-mobile-debug.apk build/ci-artifacts/boltbytes-media-mobile-debug.apk
          cp build/app/outputs/flutter-apk/app-tv-debug.apk build/ci-artifacts/boltbytes-media-tv-debug.apk
      - name: Certify merged Android manifests and artifacts
        run: >-
          node ../../scripts/android-release-evidence.mjs
          --mobile build/ci-artifacts/boltbytes-media-mobile-debug.apk
          --tv build/ci-artifacts/boltbytes-media-tv-debug.apk
          --version 0.1.0
          --build-number ${{ github.run_number }}
          --commit ${{ github.sha }}
          --repository ${{ github.repository }}
          --output-dir build/release-gate
          --allow-debug-signing true
      - name: Upload certified debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boltbytes-android-debug-${{ github.run_number }}
          path: |
            clients/mobile-tv/build/ci-artifacts/*.apk
            clients/mobile-tv/build/release-gate/*
          if-no-files-found: error
          retention-days: 14
