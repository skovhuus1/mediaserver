name: boltbytes-media

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  transcode-init:
    image: alpine:3.20
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /transcode"]
    volumes:
      - transcode_data:/transcode

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      MEDIA_MOUNT_PATH: /media
      TRANSCODE_PATH: /transcode
      BB_MEDIA_UPDATE_REPO_PATH: /workspace
    volumes:
      - .:/workspace
      - ${MEDIA_PATH:-./media}:/media:ro
      - ${DOWNLOADS_PATH:-./downloads}:/downloads
      - transcode_data:/transcode
      - application_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/system/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  admin:
    build:
      context: .
      dockerfile: web/admin/Dockerfile
      args:
        API_INTERNAL_URL: http://api:3001
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      BB_MEDIA_WORKER_MODE: jobs
      TRANSCODE_PATH: /transcode
    volumes:
      - ${MEDIA_PATH:-./media}:/media:ro
      - ${DOWNLOADS_PATH:-./downloads}:/downloads
      - transcode_data:/transcode
      - application_data:/app/data
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  transcoder:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      BB_MEDIA_WORKER_MODE: transcode
      TRANSCODE_PATH: /transcode
    volumes:
      - ${MEDIA_PATH:-./media}:/media:ro
      - transcode_data:/transcode
    depends_on:
      transcode-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-5555}:5555"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - admin
      - api

volumes:
  postgres_data:
  redis_data:
  transcode_data:
  application_data:
