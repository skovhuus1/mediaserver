version: "3.9"

name: bb-media

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bbmedia}
      POSTGRES_USER: ${POSTGRES_USER:-bbmedia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bbmedia_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bbmedia}"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --protected-mode no --port 6379
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://bbmedia:bbmedia_pass@postgres:5432/bbmedia
      REDIS_URL: redis://redis:6379
      PORT: 5555
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:5555
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5555/api/v1/system/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  admin:
    build:
      context: .
      dockerfile: web/admin/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001/api/v1
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "3000"

  reverse-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - admin
    ports:
      - "5555:80"
    volumes:
      - ./infra/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  pgdata:
